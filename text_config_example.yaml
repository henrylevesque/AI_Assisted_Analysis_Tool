# Example YAML config for text_analysis.py
# Save this as text_config.yaml and run: python text_analysis.py --config text_config.yaml --no-interactive

# Models to use (array of model names from ollama)
use_multiple_models: false
models:
  - gemma3:12b

# Prompt customization: what to look for in the text
prompt_desc: "Main topic or theme"

# Input/output paths:
# - input: File path (e.g., ./data/abstracts.xlsx) or folder path (e.g., ./data/)
# - output: File path (e.g., ./results.xlsx), folder path (e.g., ./results/), or leave empty/null to use input folder
input: "./data/text_input/abstracts.xlsx"
output: "./data/text_output/"

# Column names in your input file
id_col: "id"
content_col: "abstract"

# Number of times to run each row through the model (for consensus across runs)
runs: 5

# Within-model consensus: compute consensus across the multiple runs of same model on same item
within_model_consensus: true
within_model_consensus_mode: "fuzzy"  # exact, set, or fuzzy
within_model_fuzzy_threshold: 85      # 0-100, higher = stricter matching

# Between-model consensus: compute consensus across per-model results (only used with 2+ models)
between_model_consensus: false
between_model_consensus_mode: "exact"
between_model_fuzzy_threshold: 85

# Aggregated consensus: compute consensus across ALL response columns (independent from between-model)
aggregate: false
aggregated_consensus_mode: "exact"
aggregated_fuzzy_threshold: 85

# Delay in seconds between model runs (useful if switching models manually in Ollama)
delay: 0.0

# Append metadata sheet to Excel output (prompt, models, duration, CPU/GPU info, etc.)
append_metadata: true